name: ci-gpu

on:
  pull_request:
    branches:
      - HiRep-CUDA
  push:
    branches:
      - HiRep-CUDA
  workflow_dispatch:


# cancel previous workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: self-hosted

    steps:
      - name: create working dir
        run: rm -rf HiRep && mkdir HiRep

      - name: show env
        run: pwd && ls -lah && who am i
      
      - name: Download HiRep
        run: cd HiRep && wget https://github.com/claudiopica/HiRep/archive/${{ github.sha }}.tar.gz && tar -xvf ${{ github.sha }}.tar.gz --strip-components=1

  
  run-tests:
    runs-on: self-hosted
    needs: prepare
    timeout-minutes: 10

    strategy:
      # Ensures that jobs are not cancelled is one job fails
      fail-fast: false
      max-parallel: 1
      matrix:
        nc: [2, 3]
        repr: [FUND, ADJ]
        omp: [-no-omp, -omp]
        mpi: [-no-mpi, -mpi]
        ecsw: [-expclover,-no-expclover]
        exclude:
          - nc: 3
            repr: ADJ
          - omp: "-omp"
    steps:
      - name: Run HiRep GPU tests
        shell: bash
        env:
          NC: ${{ matrix.nc }}
          REPR: ${{ matrix.repr }}
          MPI_FLAG: ${{ matrix.mpi }}
          OMP_FLAG: ${{ matrix.omp }}
          ECSW_FLAG: ${{ matrix.ecsw }}
        run: |
          set -eo pipefail
          source /etc/openqcd/plymouth-env.sh

          export UCX_MEMTYPE_CACHE=n
          export HIREP_MPIRUN="$MPI_HOME/bin/mpiexec"
          export CUDA_HPC="$NVHPC_HOME"
          export CUDA_INCLUDE="$NVHPC_CUDA_HOME/include"
          export MPI_INCLUDE="$MPI_HOME/include"

          mpichversion
          mpicc -show
          nvcc --version
          nvidia-smi -L
          hirep_dir="$GITHUB_WORKSPACE/HiRep"
          cd "$hirep_dir"
          GITHUB_WORKSPACE="$hirep_dir" ./TestProgram/run_tests.sh \
            "Algebra DiracOperator Geometry Inverters LinearAlgebra Memory" \
            --gpu --newgeo --fixedstr --no-color \
            --mpicc gcc --cflags "-Wall -O1" \
            --include "-I$MPI_INCLUDE -I$CUDA_INCLUDE -I$OQCD_MATH_INCLUDE" \
            --gpuflags "-arch=sm_86" \
            --ldflags "-arch=sm_86 -L$MPI_HOME/lib -L$NVHPC_CUDA_HOME/lib64 -L$NVHPC_HOME/compilers/lib -L$OQCD_MATH_LIBDIR -lmpi" \
            -n "$NC" -r "$REPR" "$MPI_FLAG" "$OMP_FLAG" "$ECSW_FLAG"
