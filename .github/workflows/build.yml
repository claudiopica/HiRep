name: build

on:
  pull_request:
    branches:
      - HiRep-CUDA
  push:
    branches:
      - HiRep-CUDA

# cancel previous workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      # Ensures that jobs are not cancelled is one job fails
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        nc: [2, 3]
        repr: [FUND, ADJ]
        omp: [-no-omp, -omp]
        mpi: [-no-mpi, -mpi]
        ecsw: [-expclover,-no-expclover]
        exclude:
          - nc: 3
            repr: ADJ
          - mpi: "-mpi"
            omp: "-omp"

    steps:
      - name: Download HiRep
        run: wget https://github.com/claudiopica/HiRep/archive/${{ github.sha }}.tar.gz && tar -xvf ${{ github.sha }}.tar.gz --strip-components=1

      - name: Check API rate
        uses: ./.github/actions/api-rate
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          install() {
            sudo apt-get update &&
            sudo apt-get install -y --fix-missing -o Acquire::Retries=5 \
              openmpi-bin libopenmpi-dev libomp-dev ninja-build
          }
          if ! install; then
            echo "Azure mirror failed, falling back to archive.ubuntu.com"
            grep -rl 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt \
              | xargs -r sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|'
            sudo apt-get clean
            install
          fi
          command -v mpicc.openmpi
          
      - name: Configure HiRep
        run: ./Make/write_mkflags.pl -f Make/MkFlags.ini --cc ${{ matrix.compiler }} --env "OMPI_CC=${{ matrix.compiler }}" --mpicc mpicc.openmpi --cflags "-Wall -O1" -n ${{ matrix.nc }} -r ${{ matrix.repr }} ${{ matrix.mpi }} ${{ matrix.omp }} ${{ matrix.ecsw }}
      - name: Build
        run: time ./Make/nj

